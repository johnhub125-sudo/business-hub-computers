<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", sans-serif; background: #0a0f2c; color: #fff; text-align: center; padding: 24px; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-size: 1.5rem; margin: 20px 0 8px; }
      p { color: #b9c4ee; max-width: 22rem; margin: 0 auto 24px; line-height: 1.6; }
      button { background: #d62828; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Check your internet connection, then try again. Your cart and account are safe.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
